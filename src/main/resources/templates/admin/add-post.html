<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Add New Post</title>
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">

</head>
<body>
    <div layout:fragment="content" class="container py-l">
        <div class="admin-workspace">
            <!-- Sidebar Navigation -->
            <div class="admin-sidebar">
                <div class="admin-sidebar-header">
                    <i class="bi bi-shield-lock"></i> admin@academy:~$
                </div>
                
                <a th:href="@{/admin/dashboard}" class="admin-sidebar-menu-item active">
                    <i class="bi bi-terminal"></i> posts_manager()
                </a>
                <a th:href="@{/admin/categories}" class="admin-sidebar-menu-item">
                    <i class="bi bi-folder2"></i> categories_manager()
                </a>
                <a th:href="@{/admin/courses}" class="admin-sidebar-menu-item">
                    <i class="bi bi-book"></i> courses_manager()
                </a>
                
                <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.08); margin-top: 40px;">
                    <form th:action="@{/logout}" method="POST" class="m-0">
                        <button type="submit" class="admin-sidebar-menu-item" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer; padding: 8px 12px;">
                            <i class="bi bi-power" style="color: var(--accent-orange);"></i> exit()
                        </button>
                    </form>
                </div>
            </div>

            <!-- Main Workspace -->
            <div class="admin-main" style="flex-grow: 1;">
                <div class="admin-header" style="margin-bottom: 24px;">
                    <h1>new_post.sh</h1>
                    <div class="admin-actions">
                        <a th:href="@{/admin/dashboard}" class="btn btn-outline btn-orange">
                            <i class="bi bi-x-lg"></i> abort()
                        </a>
                    </div>
                </div>
                
                <div class="form-card card-glass" style="padding: 24px; border-radius: 12px;">
                    <form th:action="@{/admin/add-post}" method="POST" enctype="multipart/form-data">
                        <div class="form-group">
                            <label for="title" class="form-label">// STRING: title</label>
                            <input type="text" id="title" name="title" placeholder="Entry title..." class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="image" class="form-label" style="color: var(--accent-orange);">// FILE: image</label>
                            <input type="file" id="image" name="image" accept="image/*" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="markdownFile" class="form-label" style="color: var(--accent-blue);">// FILE: markdown_import (.md)</label>
                            <input type="file" id="markdownFile" name="markdownFile" accept=".md" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="category" class="form-label">// SELECT: category</label>
                            <select id="category" name="category.id" class="form-control">
                                <option value="">-- No Category --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">// MULTI_SELECT: tags</label>
                            <div class="tag-selector">
                                <div th:each="tag : ${tags}" class="tag-option">
                                    <input type="checkbox" name="tagIds" th:value="${tag.id}" th:id="'tag-' + ${tag.id}">
                                    <label th:for="'tag-' + ${tag.id}" th:text="${tag.name}"></label>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="body" class="form-label" style="color: var(--accent-purple);">// TEXT: body (markdown)</label>
                            <textarea id="body" name="body" rows="15" placeholder="System.out.println('Your content here...');" class="form-control"></textarea>
                        </div>

                        <div style="margin-top: 32px;">
                            <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">
                                <i class="bi bi-terminal"></i> commit_to_main()
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
        <script>
            const easyMDE = new EasyMDE({
                element: document.getElementById('body'),
                spellChecker: false,
                status: false,
                minHeight: "400px",
                placeholder: "System.out.println('Write your markdown here...');",
                toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list", "|", "link", "image", "|", "preview", "side-by-side", "fullscreen", "|", "guide"]
            });

            // Markdown File Import
            document.getElementById('markdownFile').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    easyMDE.value(content);
                };
                reader.readAsText(file);
            });
        </script>
    </th:block>
</body>
</html>
