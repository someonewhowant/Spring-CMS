<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Manage Courses</title>
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">

</head>
<body>
    <div layout:fragment="content" class="container py-l">
        <div class="admin-workspace">
            <!-- Sidebar Navigation -->
            <div class="admin-sidebar">
                <div class="admin-sidebar-header">
                    <i class="bi bi-shield-lock"></i> admin@academy:~$
                </div>
                
                <a th:href="@{/admin/dashboard}" class="admin-sidebar-menu-item">
                    <i class="bi bi-terminal"></i> posts_manager()
                </a>
                <a th:href="@{/admin/categories}" class="admin-sidebar-menu-item">
                    <i class="bi bi-folder2"></i> categories_manager()
                </a>
                <a th:href="@{/admin/courses}" class="admin-sidebar-menu-item active">
                    <i class="bi bi-book"></i> courses_manager()
                </a>
                
                <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.08); margin-top: 40px;">
                    <form th:action="@{/logout}" method="POST" class="m-0">
                        <button type="submit" class="admin-sidebar-menu-item" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer; padding: 8px 12px;">
                            <i class="bi bi-power" style="color: var(--accent-orange);"></i> exit()
                        </button>
                    </form>
                </div>
            </div>

            <!-- Main Workspace -->
            <div class="admin-main" style="flex-grow: 1;">
                <div class="admin-header" style="margin-bottom: 24px;">
                    <h1>root@admin:~/courses$</h1>
                    <div class="admin-actions">
                        <button type="button" onclick="openAddCourseDrawer()" class="btn btn-primary">
                            <i class="bi bi-plus-lg"></i> new_course()
                        </button>
                    </div>
                </div>
                
                <div class="admin-table-wrapper card-glass" style="padding: 12px; border-radius: 12px;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>COURSE_TITLE</th>
                                <th>LEVEL</th>
                                <th>DURATION</th>
                                <th style="text-align: right;">ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="course : ${courses}">
                                <td th:text="${course.title}" style="font-weight: 500;">Title</td>
                                <td>
                                    <span th:text="${course.level}" class="badge-tag">Level</span>
                                </td>
                                <td th:text="${course.duration}" style="font-family: var(--font-mono); font-size: 0.85rem;">Duration</td>
                                <td>
                                    <div class="admin-actions justify-end" style="gap: 8px;">
                                        <a th:href="@{/admin/courses/{id}/modules(id=${course.id})}" class="btn btn-outline btn-xs btn-blue">
                                            <i class="bi bi-stack"></i> MODULES
                                        </a>
                                        <a th:href="@{/admin/courses/{id}/quizzes(id=${course.id})}" class="btn btn-outline btn-xs btn-orange">
                                            <i class="bi bi-question-circle"></i> QUIZZES
                                        </a>
                                        <a th:href="@{/admin/edit-course/{id}(id=${course.id})}" class="btn btn-outline btn-xs">
                                            <i class="bi bi-pencil"></i> EDIT
                                        </a>
                                        <a th:href="@{/admin/delete-course/{id}(id=${course.id})}" 
                                           class="btn btn-outline btn-delete btn-xs" 
                                           onclick="return confirm('rm -rf this_course?')">
                                            <i class="bi bi-trash3"></i> DELETE
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(courses)}">
                                <td colspan="4" class="text-center py-2xl text-dim">
                                    No courses found. Click <span class="text-blue">new_course()</span> to get started.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Add Course Drawer -->
        <div id="addCourseDrawer" class="drawer-backdrop">
            <div class="card-glass drawer-content" style="border-left: 3px solid var(--accent-blue) !important; max-width: 600px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 16px;">
                    <h3 class="font-mono" style="margin: 0; font-size: 1.3rem; color: var(--accent-blue); font-weight: 700; display: flex; align-items: center; gap: 10px;">
                        <i class="bi bi-journal-plus"></i> new_course()
                    </h3>
                    <button type="button" onclick="closeAddCourseDrawer()" style="background: none; border: none; color: var(--text-dim); font-size: 1.25rem; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.05)'; this.style.color='var(--text-main)'" onmouseout="this.style.background='none'; this.style.color='var(--text-dim)'">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                
                <p style="color: var(--text-dim); font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px;">
                    Развернуть новый учебный курс в системе.
                </p>
                
                <form th:action="@{/admin/add-course}" method="POST" enctype="multipart/form-data" style="margin: 0; display: flex; flex-direction: column; flex-grow: 1;">
                    <div style="flex-grow: 1;">
                        <div style="margin-bottom: 20px;">
                            <label for="title" class="font-mono" style="font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 8px;">title</label>
                            <input type="text" id="title" name="title" class="form-control" placeholder="Course title..." required
                                style="width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s;"
                                onfocus="this.style.borderColor='var(--accent-blue)'"
                                onblur="this.style.borderColor='var(--border-subtle)'">
                        </div>

                        <div style="display: flex; gap: 16px; margin-bottom: 20px;">
                            <div style="flex: 1;">
                                <label for="level" class="font-mono" style="font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 8px;">level</label>
                                <select id="level" name="level" class="form-control" required
                                    style="width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.95rem; outline: none;">
                                    <option value="Beginner">Beginner</option>
                                    <option value="Intermediate">Intermediate</option>
                                    <option value="Advanced">Advanced</option>
                                </select>
                            </div>
                            <div style="flex: 1;">
                                <label for="duration" class="font-mono" style="font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 8px;">duration</label>
                                <input type="text" id="duration" name="duration" class="form-control" placeholder="e.g. 12 Hours" required
                                    style="width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s;"
                                    onfocus="this.style.borderColor='var(--accent-blue)'"
                                    onblur="this.style.borderColor='var(--border-subtle)'">
                            </div>
                        </div>

                        <div style="margin-bottom: 20px;">
                            <label for="image" class="font-mono" style="font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 8px;">cover_image</label>
                            <input type="file" id="image" name="image" accept="image/*" class="form-control"
                                style="font-size: 0.85rem; color: var(--text-dim);">
                        </div>

                        <div style="margin-bottom: 20px;">
                            <label for="description" class="font-mono" style="font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 8px;">short_description</label>
                            <textarea id="description" name="description" rows="3" placeholder="Brief overview of the course..." required
                                style="width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s; resize: vertical;"
                                onfocus="this.style.borderColor='var(--accent-blue)'"
                                onblur="this.style.borderColor='var(--border-subtle)'"></textarea>
                        </div>

                        <div style="margin-bottom: 20px;">
                            <label for="markdownFile" class="font-mono" style="font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 8px;">content_import (.md)</label>
                            <input type="file" id="markdownFile" name="markdownFile" accept=".md" class="form-control"
                                style="font-size: 0.85rem; color: var(--text-dim);">
                        </div>

                        <div style="margin-bottom: 24px;">
                            <label for="content" class="font-mono" style="font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 8px;">course_materials (markdown)</label>
                            <textarea id="content" name="content" rows="8" placeholder="## Module 1..." class="form-control"></textarea>
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 16px; margin-top: auto; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 20px;">
                        <button type="button" class="btn btn-outline" style="border-radius: 20px; flex: 1; padding: 10px;" onclick="closeAddCourseDrawer()">
                            Отмена
                        </button>
                        <button type="submit" class="btn" style="background: var(--accent-blue); color: white; border-radius: 20px; flex: 1; padding: 10px; font-weight: 600; border: none; transition: background 0.2s;" onmouseover="this.style.background='#58a6ff'" onmouseout="this.style.background='var(--accent-blue)'">
                            Создать
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
        <script>
            let easyMDE;
            
            function openAddCourseDrawer() {
                const drawer = document.getElementById('addCourseDrawer');
                drawer.style.display = 'flex';
                setTimeout(() => {
                    drawer.firstElementChild.style.transform = 'translateX(0)';
                    
                    // Lazy initialize EasyMDE when drawer is shown to prevent rendering glitches
                    if (!easyMDE) {
                        easyMDE = new EasyMDE({
                            element: document.getElementById('content'),
                            spellChecker: false,
                            status: false,
                            minHeight: "200px",
                            placeholder: "## Course Content...",
                            toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list", "|", "link", "image", "|", "preview", "side-by-side", "fullscreen", "|", "guide"]
                        });
                        
                        // Markdown File Import
                        document.getElementById('markdownFile').addEventListener('change', function(e) {
                            const file = e.target.files[0];
                            if (!file) return;

                            const reader = new FileReader();
                            reader.onload = function(e) {
                                const content = e.target.result;
                                easyMDE.value(content);
                            };
                            reader.readAsText(file);
                        });
                    }
                }, 10);
            }
            
            function closeAddCourseDrawer() {
                const drawer = document.getElementById('addCourseDrawer');
                drawer.firstElementChild.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    drawer.style.display = 'none';
                }, 350);
            }
        </script>
    </th:block>
</body>
</html>
