<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Categories</title>
</head>
<body>
    <div layout:fragment="content" class="container py-l">
        <div class="admin-workspace">
            <!-- Sidebar Navigation -->
            <div class="admin-sidebar">
                <div class="admin-sidebar-header">
                    <i class="bi bi-shield-lock"></i> admin@academy:~$
                </div>
                
                <a th:href="@{/admin/dashboard}" class="admin-sidebar-menu-item">
                    <i class="bi bi-terminal"></i> posts_manager()
                </a>
                <a th:href="@{/admin/categories}" class="admin-sidebar-menu-item active">
                    <i class="bi bi-folder2"></i> categories_manager()
                </a>
                <a th:href="@{/admin/courses}" class="admin-sidebar-menu-item">
                    <i class="bi bi-book"></i> courses_manager()
                </a>
                
                <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.08); margin-top: 40px;">
                    <form th:action="@{/logout}" method="POST" class="m-0">
                        <button type="submit" class="admin-sidebar-menu-item" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer; padding: 8px 12px;">
                            <i class="bi bi-power" style="color: var(--accent-orange);"></i> exit()
                        </button>
                    </form>
                </div>
            </div>

            <!-- Main Workspace -->
            <div class="admin-main" style="flex-grow: 1;">
                <div class="admin-header" style="margin-bottom: 24px;">
                    <h1>root@admin:~/categories$</h1>
                    <div class="admin-actions">
                        <button type="button" onclick="openAddCategoryDrawer()" class="btn btn-primary">
                            <i class="bi bi-plus-lg"></i> new_category()
                        </button>
                    </div>
                </div>
                
                <div class="admin-table-wrapper card-glass" style="padding: 12px; border-radius: 12px;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>NAME</th>
                                <th>SLUG</th>
                                <th style="text-align: right;">ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="category : ${categories}">
                                <td th:text="${category.id}" class="text-accent-mono" style="color: var(--accent-orange); font-family: var(--font-mono);">1</td>
                                <td th:text="${category.name}" style="font-weight: 500;">General</td>
                                <td th:text="${category.slug}" class="text-accent-mono opacity-70" style="font-family: var(--font-mono); font-size: 0.85rem;">general</td>
                                <td>
                                    <div class="admin-actions" style="justify-content: flex-end;">
                                        <a th:href="@{/admin/delete-category/{id}(id=${category.id})}" 
                                           class="btn btn-outline btn-delete btn-xs" 
                                           onclick="return confirm('rm -rf this_category?')">
                                            <i class="bi bi-trash3"></i> DELETE
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="4" class="text-center py-2xl text-dim">
                                    No categories found. Click <span class="text-green">new_category()</span> to create one.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Add Category Drawer -->
        <div id="addCategoryDrawer" class="drawer-backdrop">
            <div class="card-glass drawer-content" style="border-left: 3px solid var(--accent-green) !important;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 16px;">
                    <h3 class="font-mono" style="margin: 0; font-size: 1.3rem; color: var(--accent-green); font-weight: 700; display: flex; align-items: center; gap: 10px;">
                        <i class="bi bi-folder-plus"></i> new_category()
                    </h3>
                    <button type="button" onclick="closeAddCategoryDrawer()" style="background: none; border: none; color: var(--text-dim); font-size: 1.25rem; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.05)'; this.style.color='var(--text-main)'" onmouseout="this.style.background='none'; this.style.color='var(--text-dim)'">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
                
                <p style="color: var(--text-dim); font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px;">
                    Добавить новую категорию для статей и постов в системе.
                </p>
                
                <form th:action="@{/admin/categories}" method="POST" style="margin: 0; display: flex; flex-direction: column; flex-grow: 1;">
                    <div style="flex-grow: 1;">
                        <div style="margin-bottom: 20px;">
                            <label for="name" class="font-mono" style="font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 8px;">category_name</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="Например: Программирование" required
                                style="width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s;"
                                onfocus="this.style.borderColor='var(--accent-green)'"
                                onblur="this.style.borderColor='var(--border-subtle)'">
                        </div>
                        <div style="margin-bottom: 24px;">
                            <label for="slug" class="font-mono" style="font-size: 0.8rem; color: var(--text-dim); display: block; margin-bottom: 8px;">slug (необязательно)</label>
                            <input type="text" id="slug" name="slug" class="form-control" placeholder="auto-generated-if-empty"
                                style="width: 100%; padding: 10px 14px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s;"
                                onfocus="this.style.borderColor='var(--accent-green)'"
                                onblur="this.style.borderColor='var(--border-subtle)'">
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 16px; margin-top: auto; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 20px;">
                        <button type="button" class="btn btn-outline" style="border-radius: 20px; flex: 1; padding: 10px;" onclick="closeAddCategoryDrawer()">
                            Отмена
                        </button>
                        <button type="submit" class="btn" style="background: var(--accent-green); color: white; border-radius: 20px; flex: 1; padding: 10px; font-weight: 600; border: none; transition: background 0.2s;" onmouseover="this.style.background='#4cd964'" onmouseout="this.style.background='var(--accent-green)'">
                            Сохранить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            function openAddCategoryDrawer() {
                const drawer = document.getElementById('addCategoryDrawer');
                drawer.style.display = 'flex';
                setTimeout(() => {
                    drawer.firstElementChild.style.transform = 'translateX(0)';
                }, 10);
            }
            function closeAddCategoryDrawer() {
                const drawer = document.getElementById('addCategoryDrawer');
                drawer.firstElementChild.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    drawer.style.display = 'none';
                }, 350);
            }
        </script>
    </th:block>
</body>
</html>
