<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title th:text="${title}">Create Coding Task</title>
</head>
<body>
    <div layout:fragment="content" class="container py-l">
        <div class="admin-header">
            <h1 class="text-green font-mono">teacher@cabinet:~/coding-tasks/new$</h1>
            <div class="admin-actions">
                <a th:href="@{/teacher/courses/{id}/modules(id=${module.course.id})}" class="btn btn-outline btn-orange">
                    <i class="bi bi-arrow-left"></i> back_to_modules()
                </a>
            </div>
        </div>

        <div class="card-glass fade-in" style="padding: 32px; margin-top: 32px; border-left: 4px solid var(--accent-green);">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
                <i class="bi bi-terminal text-green" style="font-size: 2rem;"></i>
                <div>
                    <h2 class="font-mono text-green" style="margin: 0; font-size: 1.2rem;">// CREATE_CODING_TASK</h2>
                    <p class="text-dim" style="margin: 4px 0 0; font-size: 0.85rem;" th:text="'Module: ' + ${module.title}">Module name</p>
                </div>
            </div>

            <form th:action="@{/teacher/modules/{moduleId}/coding-tasks/new(moduleId=${module.id})}" method="POST">
                <div class="form-group">
                    <label for="title" class="form-label">// STRING: task_title</label>
                    <input type="text" id="title" name="title" placeholder="FizzBuzz Challenge" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="description" class="form-label" style="color: var(--accent-purple);">// TEXT: task_description (markdown)</label>
                    <textarea id="description" name="description" rows="6" placeholder="Write a function that returns..." class="form-control" required></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label for="language" class="form-label" style="color: var(--accent-blue);">// ENUM: language</label>
                        <select id="language" name="language" class="form-control" required>
                            <option value="javascript">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="java">Java</option>
                            <option value="c">C</option>
                            <option value="cpp">C++</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="pointsReward" class="form-label" style="color: var(--accent-orange);">// INT: xp_reward</label>
                        <input type="number" id="pointsReward" name="pointsReward" value="50" min="10" max="500" class="form-control" required>
                    </div>

                    <div class="form-group" style="display: flex; align-items: flex-end;">
                        <div style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-dim); padding: 10px 14px; background: rgba(128,128,128,0.05); border-radius: var(--radius); border: 1px solid var(--border-subtle); width: 100%; text-align: center;">
                            <i class="bi bi-shield-check text-green"></i> Piston API Sandbox
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="starterCode" class="form-label" style="color: var(--accent-green);">// CODE: starter_code (pre-filled in editor)</label>
                    <textarea id="starterCode" name="starterCode" rows="8" class="form-control" style="font-family: var(--font-mono); font-size: 0.85rem; background: var(--bg-dark);" placeholder="// Write your starter code here...
function solve(input) {
  // Your code here
}"></textarea>
                </div>

                <div class="form-group">
                    <label for="testCasesJson" class="form-label" style="color: var(--accent-orange);">// JSON: test_cases</label>
                    <textarea id="testCasesJson" name="testCasesJson" rows="10" class="form-control" style="font-family: var(--font-mono); font-size: 0.85rem; background: var(--bg-dark);" required placeholder='[
  {"input": "5", "expectedOutput": "25", "label": "Square of 5"},
  {"input": "0", "expectedOutput": "0", "label": "Square of 0"},
  {"input": "-3", "expectedOutput": "9", "label": "Negative number"}
]'></textarea>
                    <p class="text-dim" style="font-size: 0.75rem; margin-top: 6px; font-family: var(--font-mono);">
                        Format: JSON array of objects with "input", "expectedOutput", "label" fields.
                        The student's program stdout is compared against expectedOutput (trimmed).
                    </p>
                </div>

                <div style="margin-top: 32px;">
                    <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">
                        <i class="bi bi-terminal"></i> deploy_coding_task()
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
