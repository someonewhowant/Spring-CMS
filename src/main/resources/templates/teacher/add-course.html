<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title th:text="${title}">Create Course</title>
</head>
<body>
    <div layout:fragment="content" class="container py-l">
        <div class="admin-workspace">
            <!-- Sidebar Navigation -->
            <div class="admin-sidebar">
                <div class="admin-sidebar-header">
                    <i class="bi bi-person-workspace"></i> teacher@cabinet:~$
                </div>
                
                <a th:href="@{/teacher/dashboard}" class="admin-sidebar-menu-item">
                    <i class="bi bi-terminal"></i> dashboard()
                </a>
                <a th:href="@{/teacher/courses}" class="admin-sidebar-menu-item active">
                    <i class="bi bi-book"></i> courses_manager()
                </a>
                <a th:href="@{/teacher/coding-tasks}" class="admin-sidebar-menu-item">
                    <i class="bi bi-code-square"></i> coding_tasks()
                </a>
                <a th:href="@{/teacher/students}" class="admin-sidebar-menu-item">
                    <i class="bi bi-people"></i> students_dir()
                </a>
                <a th:href="@{/teacher/analytics}" class="admin-sidebar-menu-item">
                    <i class="bi bi-graph-up-arrow"></i> analytics()
                </a>
                
                <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.08); margin-top: 40px;">
                    <form th:action="@{/logout}" method="POST" class="m-0">
                        <button type="submit" class="admin-sidebar-menu-item" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer; padding: 8px 12px;">
                            <i class="bi bi-power" style="color: var(--accent-orange);"></i> exit()
                        </button>
                    </form>
                </div>
            </div>

            <!-- Main Workspace -->
            <div class="admin-main" style="flex-grow: 1;">
                <div class="admin-header">
                    <h1 class="text-green font-mono">teacher@cabinet:~/courses/new$</h1>
                    <div class="admin-actions">
                        <a th:href="@{/teacher/courses}" class="btn btn-outline btn-orange">
                            <i class="bi bi-arrow-left"></i> back_to_courses()
                        </a>
                    </div>
                </div>

                <div class="post-form-container fade-in mt-xl">
                    <h2 class="mb-xl text-orange font-mono text-l">
                        <i class="bi bi-terminal"></i> create_new_course()
                    </h2>
                    <form th:action="@{/teacher/add-course}" method="POST" enctype="multipart/form-data">
                        <div class="form-group">
                            <label for="title" class="form-label">// STRING: course_title</label>
                            <input type="text" id="title" name="title" placeholder="Introduction to Spring Boot..." class="form-control" required>
                        </div>

                        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div class="form-group">
                                <label for="level" class="form-label">// ENUM: difficulty_level</label>
                                <select id="level" name="level" class="form-control" required>
                                    <option value="Beginner">Beginner</option>
                                    <option value="Intermediate">Intermediate</option>
                                    <option value="Advanced">Advanced</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="duration" class="form-label">// STRING: course_duration</label>
                                <input type="text" id="duration" name="duration" placeholder="e.g., 10 hours" class="form-control" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="description" class="form-label">// STRING: course_description</label>
                            <textarea id="description" name="description" rows="3" placeholder="A comprehensive guide to learning..." class="form-control" required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="image" class="form-label" style="color: var(--accent-blue);">// FILE: cover_image (PNG, JPG)</label>
                            <input type="file" id="image" name="image" accept="image/*" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="markdownFile" class="form-label" style="color: var(--accent-blue);">// FILE: content_import (.md) - optional</label>
                            <input type="file" id="markdownFile" name="markdownFile" accept=".md" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="content" class="form-label" style="color: var(--accent-purple);">// TEXT: course_introduction (markdown)</label>
                            <textarea id="content" name="content" rows="10" placeholder="## Welcome..." class="form-control"></textarea>
                        </div>

                        <div style="margin-top: 32px;">
                            <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">
                                <i class="bi bi-terminal"></i> save_course()
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
        <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
        <script>
            const easyMDE = new EasyMDE({
                element: document.getElementById('content'),
                spellChecker: false,
                autosave: {
                    enabled: true,
                    uniqueId: "teacherAddCourseContent",
                    delay: 1000,
                },
                placeholder: "## Welcome to the Course...",
                minHeight: "400px"
            });
        </script>

    </th:block>
</body>
</html>
